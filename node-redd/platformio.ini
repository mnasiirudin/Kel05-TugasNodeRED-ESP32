[env:esp1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SHT4x Library
    adafruit/Adafruit Unified Sensor@^1.1.14
build_src_filter = -<*> +<esp1_sht40/*>

[env:esp2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit Unified Sensor@^1.1.14
build_src_filter = -<*> +<esp2_sht30/*>

[env:esp3]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit Unified Sensor@^1.1.14
build_src_filter = -<*> +<esp3_pot/*>

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    plapointe6/EspMQTTClient@^1.13.3
build_src_filter = -<*> +<esp32c3/*>